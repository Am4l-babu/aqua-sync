name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [development, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Test
        working-directory: backend
        run: python -m pytest tests/ -q

      # The twin core must stay importable without any web framework
      # installed. If this breaks, a web dependency has leaked into
      # aquasync/twin, and the simulation core has stopped being testable
      # in isolation.
      - name: Check the simulation core has no web dependencies
        working-directory: backend
        run: |
          pip uninstall -y fastapi uvicorn pydantic starlette
          python -c "import aquasync.twin; print('twin core imports cleanly')"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Pinned deliberately. An unpinned linter means CI breaks whenever the
      # tool ships a new default rule - which is exactly what happened when
      # ruff 0.16 enabled ISC004. Bump this on purpose, not by surprise.
      - run: pip install ruff==0.16.4
      - run: ruff check backend/ scripts/

  # Catches the class of defect that does not raise: a document builder using a
  # character its font cannot draw. reportlab's base-14 fonts drop those
  # silently, which is how the layer diagram lost every arrow, the hydropower
  # formula rendered as "gQH", and star counts became bare numbers - all in a
  # PDF that built without a single warning.
  #
  # The regeneration and determinism checks in scripts/check.py need the
  # bulletin cache in data/raw/, which is gitignored, so they stay local.
  # --fast is the subset that runs anywhere.
  selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff==0.16.4
      - run: python scripts/check.py --fast
