; Bench test 5 of 6 - NEMA 17 + A4988 + limit switches, off the rig.
;
;   pio run -t upload -e esp32dev
;   pio device monitor
;
; Do this one with the gate mechanism NOT yet mounted in the tank wall, on a
; bench where a runaway motor cannot jam anything expensive. It moves the
; instant it is powered and homed - keep fingers clear of the rack.

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags   = -Wall
