; Bench test 2 of 6 - both ultrasonic sensors, one at a time.
;
; The JSN-SR04T (waterproof, tank 1) and the HC-SR04 (dry, tank 2) speak the
; same protocol - a trigger pulse, then a pulse-width echo - so one sketch
; tests both. Wire whichever one you are testing to the same two pins and
; re-flash nothing; just swap the wires and re-open the serial monitor.
;
;   pio run -t upload -e esp32dev
;   pio device monitor

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags   = -Wall
