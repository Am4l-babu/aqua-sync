; Bench test 4 of 6 - the BMP280 barometric sensor (squall pre-detection).
;
;   pio run -t upload -e esp32dev
;   pio device monitor
;
; NOTE: this is the one bench project whose libraries are not already cached
; from the main firmware build (node_reservoir only pulls DallasTemperature,
; OneWire and PubSubClient). The first `pio run` here needs internet access
; once, to fetch the two Adafruit libraries below.

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags   = -Wall

lib_deps =
    adafruit/Adafruit BMP280 Library@^2.6.8
    adafruit/Adafruit Unified Sensor@^1.1.14
