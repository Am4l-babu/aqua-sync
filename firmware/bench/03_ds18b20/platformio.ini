; Bench test 3 of 6 - the DS18B20 waterproof temperature probe.
;
;   pio run -t upload -e esp32dev
;   pio device monitor

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags   = -Wall

lib_deps =
    milesburton/DallasTemperature@^3.11.0
    paulstoffregen/OneWire@^2.3.8
