; Bench test 1 of 6 - the ESP32 board itself, alone.
;
;   pio run -t upload -e esp32dev
;   pio device monitor
;
; No sensors wired yet. This confirms the board, the USB data cable (not a
; charge-only one - BOM item 19 calls this out because it costs hours of
; debugging otherwise), the toolchain and Wi-Fi all work before anything
; else is connected to it.

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -Wall
    -DWIFI_SSID='"CHANGE_ME"'
    -DWIFI_PASSWORD='"CHANGE_ME"'
