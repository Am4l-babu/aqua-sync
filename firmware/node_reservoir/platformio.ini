; AquaSync reservoir node
;
;   pio run -t upload -e esp32dev
;   pio device monitor

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework  = arduino
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    knolleary/PubSubClient@^2.8
    milesburton/DallasTemperature@^3.11.0
    paulstoffregen/OneWire@^2.3.8

build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=2

; Uncomment to keep credentials out of the repository:
; build_flags = ${env.build_flags} -DWIFI_SSID='"..."' -DWIFI_PASSWORD='"..."'
